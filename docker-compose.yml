# Local stack. Pin and verify image tags before relying on them.
services:
  api:
    build: .
    env_file: .env.example
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      RAG_REDIS_URL: redis://redis:6379/0
      RAG_EMBEDDING_URL: http://embedder:80
      RAG_EMBEDDING_DIM: "1024"
      RAG_RERANKER_URL: http://embedder:80
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-ollama}
      RAG_OLLAMA_URL: http://host.docker.internal:11434
      RAG_OLLAMA_MODEL: gemma4:e2b
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      RAG_OPENAI_MODEL: ${RAG_OPENAI_MODEL:-gpt-4.1}
      RAG_OPENAI_BASE_URL: ${RAG_OPENAI_BASE_URL:-https://api.openai.com/v1}
      RAG_LANGFUSE_URL: ${RAG_LANGFUSE_URL:-${LANGFUSE_BASE_URL:-}}
      RAG_LANGFUSE_PUBLIC_KEY: ${RAG_LANGFUSE_PUBLIC_KEY:-${LANGFUSE_PUBLIC_KEY:-}}
      RAG_LANGFUSE_SECRET_KEY: ${RAG_LANGFUSE_SECRET_KEY:-${LANGFUSE_SECRET_KEY:-}}
      RAG_CORPUS_DIR: /corpus
    ports: ["8000:8000"]
    volumes:
      - ./corpus:/corpus:ro
      - ./src/ragkit:/app/.venv/lib/python3.12/site-packages/ragkit:ro
    depends_on: [qdrant, postgres, redis, embedder]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5433:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
  redis:
    image: redis:7.4
    ports: ["6379:6379"]
  embedder:
    build: ./deploy/embedder
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
    ports: ["8081:80"]
    volumes:
      - embed_cache:/root/.cache
      - ./deploy/embedder/server.py:/app/server.py:ro
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
volumes:
  qdrant_data:
  pg_data:
  minio_data:
  embed_cache:
